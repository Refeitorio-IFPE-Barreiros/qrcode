<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Refeitório - IFPE Barreiros</title>

    <!--
    AULA TDS: NOVO — dica de PRECONNECT (e dns-prefetch como reforço pra
    navegadores mais antigos, que não suportam preconnect) pro domínio do
    Apps Script. Sem isso, o navegador só começa a resolver o DNS e abrir
    a conexão TCP/TLS pro script.google.com quando o JavaScript roda e
    define o "src" do iframe — com essa dica, essa conexão pode começar
    EM PARALELO, bem antes do JavaScript executar. Ganho típico de
    100-500ms (dependendo da rede), só de eliminar essa espera sequencial.
    -->
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="dns-prefetch" href="https://script.google.com">

    <!--
    AULA TDS: CORRIGIDO — versão anterior desta página fazia um
    REDIRECIONAMENTO de topo (window.location.replace) pro Apps Script.
    Isso resolvia o problema do Gmail reescrevendo o link na hora de
    EXIBIR, mas não resolvia um problema mais profundo, descoberto depois:
    em CELULAR (Android/iPhone), o próprio sistema/app intercepta a
    NAVEGAÇÃO DE TOPO pra domínios "script.google.com" e tenta rotear pela
    conta Google logada no aparelho — mesmo vindo de um redirecionamento
    JavaScript, não só de um clique direto em e-mail. O resultado era o
    mesmo problema de sempre (Google Drive, "arquivo não pode ser
    exibido"), só que agora com uma URL ainda mais estranha
    (".../a/macros/dominio/s/.../exec").

    A SOLUÇÃO: em vez de REDIRECIONAR o navegador pra lá (uma navegação de
    topo, que é o que essas interceptações de app miram), esta página
    agora INCORPORA o painel dentro de si mesma, usando um <iframe>. Um
    iframe é só um pedido de SUB-RECURSO da página (como uma imagem ou um
    vídeo embutido) — o navegador nunca "vai" pra script.google.com de
    verdade, o endereço na barra continua sendo o do GitHub Pages o tempo
    todo. Isso evita completamente a interceptação de app que causava o
    problema, porque essa interceptação só age em cima de navegação de
    topo, não em cima de sub-recursos carregados dentro de uma página.

    Isso só funciona porque o Apps Script (ponte_visualizacao_apps_script.gs)
    já está configurado com .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
    — ou seja, ele já permite ser incorporado em iframe de qualquer origem.

    MANUTENÇÃO: se um dia o Apps Script for republicado com uma URL nova
    (nova implantação), atualize só a constante DESTINO_PAINEL abaixo — não
    precisa mexer em mais nada.
    -->

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #tela_carregando {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background-color: #f4f7f6;
            transition: opacity 0.25s ease;
        }
        #tela_carregando.escondida {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #e2e8f0;
            border-top-color: #1e7b34;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes girar {
            to { transform: rotate(360deg); }
        }
        #tela_carregando h1 {
            font-size: 18px;
            color: #1e7b34;
            margin-bottom: 8px;
        }
        #tela_carregando p {
            font-size: 14px;
            color: #64748b;
        }
        #tela_carregando a {
            color: #1e7b34;
            font-weight: 700;
        }
        #frame_painel {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="tela_carregando">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Abrindo o Painel do Refeitório...</h1>
        <p>Se não carregar em alguns segundos, <a id="link-manual" href="#" target="_blank" rel="noopener">clique aqui para abrir numa aba nova</a>.</p>
    </div>

    <!--
    AULA TDS: NOVO — esta função precisa existir ANTES do iframe abaixo,
    numa ordem estrita: como o iframe agora começa a carregar direto do
    HTML (ver "src" no elemento abaixo, colocado assim de propósito pra
    ganhar velocidade), ele PODE disparar o evento "load" muito rápido —
    inclusive antes do script principal, lá embaixo no fim da página, ter
    sido processado. Se a função só existisse lá embaixo, o onload do
    iframe tentaria chamar algo que ainda não existe, e o spinner ficaria
    preso na tela pra sempre, mesmo com o painel já carregado por trás.
    Colocando a função aqui, ela já existe no momento exato em que o
    iframe é criado — sem nenhuma janela de tempo onde isso poderia falhar.
    -->
    <script>
        function aoCarregarPainel() {
            document.getElementById('tela_carregando').classList.add('escondida');
            document.getElementById('frame_painel').style.display = 'block';
        }
    </script>

    <!--
    AULA TDS: NOVO — o "src" agora vai DIRETO no HTML do iframe (endereço
    padrão, sem parâmetros), em vez de só ser definido depois via
    JavaScript. Isso deixa o navegador começar a carregar o painel
    ENQUANTO ainda está processando o resto da página — antes até do
    script principal (lá embaixo) executar. O script principal só troca
    esse endereço se a página tiver recebido algum parâmetro (ex: alguém
    acessando um link salvo antigo com "?senha=..."), um caso raro onde
    essa vantagem de velocidade se perde, mas o funcionamento continua
    correto.
    -->
    <iframe id="frame_painel" title="Painel do Refeitório" style="display:none;"
            src="https://script.google.com/macros/s/AKfycbwyEaJx35VuwBB37vFdPSEJvDaiTu1EJKloLmaXL799zE5AGYZAyrceVXNIYZnpeFC5dg/exec"
            onload="aoCarregarPainel()"></iframe>

    <script>
        // AULA TDS: atualize esta URL sempre que o Apps Script for
        // republicado com uma nova implantação. Use SEMPRE a versão SEM
        // "/a/dominio/" no meio (ver aviso completo em automacao_relatorio.py).
        var DESTINO_PAINEL = "https://script.google.com/macros/s/AKfycbwyEaJx35VuwBB37vFdPSEJvDaiTu1EJKloLmaXL799zE5AGYZAyrceVXNIYZnpeFC5dg/exec";

        var telaCarregando = document.getElementById('tela_carregando');
        var frame = document.getElementById('frame_painel');
        var linkManual = document.getElementById('link-manual');

        // AULA TDS: CORRIGIDO — o iframe já vem com o "src" padrão direto
        // no HTML (ver acima), começando a carregar assim que a página é
        // processada, sem esperar este script rodar. O listener de "load"
        // também já foi movido pro atributo onload do próprio iframe (ver
        // aoCarregarPainel, definido ANTES do iframe), pra garantir que
        // ele já existe antes de qualquer chance do carregamento terminar.
        //
        // Este trecho só precisa TROCAR o "src" no caso raro de a página
        // ter recebido algum parâmetro (ex: ?senha=... de um link salvo
        // antigo) — sem isso, o link manual e o painel embutido ficariam
        // sem esse parâmetro. Quando troca, o navegador reinicia o
        // carregamento do zero com o endereço novo (perde a vantagem de
        // velocidade nesse caso específico, mas continua funcionando).
        var destinoFinal = DESTINO_PAINEL + window.location.search;
        linkManual.href = destinoFinal;

        if (window.location.search) {
            frame.src = destinoFinal;
        }

        // AULA TDS: proteção — se o iframe nunca disparar "load" por algum
        // motivo (ex: bloqueio de rede específico), depois de 12s mostra o
        // link manual em destaque, em vez de deixar a pessoa olhando pro
        // spinner pra sempre sem nenhuma alternativa.
        setTimeout(function () {
            if (!telaCarregando.classList.contains('escondida')) {
                document.querySelector('#tela_carregando h1').textContent = 'Está demorando mais que o esperado...';
            }
        }, 12000);
    </script>
</body>
</html>
